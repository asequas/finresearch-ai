name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: finresearch
          POSTGRES_USER: finresearch
          POSTGRES_PASSWORD: finresearch_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finresearch -d finresearch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the service container above.
      DATABASE_URL: postgresql+psycopg://finresearch:finresearch_dev@localhost:5432/finresearch
      TEST_DATABASE_URL: postgresql+psycopg://finresearch:finresearch_dev@localhost:5432/finresearch_test
      RERANKER: none  # no model download in CI; the real model has an opt-in test (-m model)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create the test database
        run: PGPASSWORD=finresearch_dev psql -h localhost -U finresearch -d finresearch -c "CREATE DATABASE finresearch_test"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
