services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: finresearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finresearch
      POSTGRES_USER: finresearch
      POSTGRES_PASSWORD: finresearch_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finresearch -d finresearch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: